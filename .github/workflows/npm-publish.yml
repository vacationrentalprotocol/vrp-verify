name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1 (Node 20 ships npm 10).
      # Pin to npm@11: npm@latest is v12, which requires Node >= 22 and fails
      # on this Node 20 runner with EBADENGINE.
      - run: npm install -g npm@11

      # Zero dependencies and no lockfile: nothing to install, nothing to build.
      - run: npm test

      # Publishes via OIDC "trusted publishing" -- configure once on
      # npmjs.com: package -> Settings -> Trusted Publisher
      # (GitHub Actions, vacationrentalprotocol/vrp-verify, workflow npm-publish.yml).
      # No NPM_TOKEN needed: npm mints a short-lived credential from the
      # id-token, and a signed provenance attestation is attached automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public
